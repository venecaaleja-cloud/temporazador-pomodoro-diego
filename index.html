<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e293b" />
  <title> Pomodoro Timer</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>🍅 Pomodoro Timer</h1>
      <button class="btn icon" id="openSettings" aria-label="Abrir configuración">⚙️</button>
    </header>

    <main>
      <!-- Pestañas de sesión -->
      <div class="session-tabs" role="tablist" aria-label="Tipo de sesión">
        <button class="session-tab active" data-type="work" role="tab" aria-selected="true">Trabajo</button>
        <button class="session-tab" data-type="shortBreak" role="tab" aria-selected="false">Descanso corto</button>
        <button class="session-tab" data-type="longBreak" role="tab" aria-selected="false">Descanso largo</button>
      </div>

      <!-- Display del temporizador -->
      <div class="timer-display">
        <p class="session-label">Sesión actual: <strong id="sessionLabel">Trabajo</strong></p>
        <div class="progress-ring" id="progressRing" style="--progress: 0%;">
          <div class="timer-text" id="timerText" aria-live="polite" aria-atomic="true">25:00</div>
        </div>
      </div>

      <!-- Controles -->
      <div class="timer-controls">
        <button class="btn primary" id="startPauseBtn">▶ Iniciar</button>
        <button class="btn secondary" id="resetBtn">🔄 Reiniciar</button>
      </div>

      <!-- Contador de sesiones -->
      <div class="session-counter">
        <p>Sesiones completadas: <strong id="completedCount">0</strong></p>
        <p class="hint">Próximo descanso largo en: <strong id="nextLongBreak">4</strong> sesión(es)</p>
      </div>

      <button class="btn text" id="resetAllBtn">Reiniciar todo</button>
    </main>
  </div>

  <!-- Modal de configuración -->
  <div class="modal-backdrop" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal">
      <h2 id="settingsTitle">⚙️ Configuración</h2>

      <label>
        Duración de trabajo (min)
        <input type="number" min="1" max="120" id="inputWork" />
      </label>

      <label>
        Descanso corto (min)
        <input type="number" min="1" max="30" id="inputShort" />
      </label>

      <label>
        Descanso largo (min)
        <input type="number" min="1" max="60" id="inputLong" />
      </label>

      <label>
        Sesiones antes del descanso largo
        <input type="number" min="2" max="10" id="inputSessions" />
      </label>

      <div class="modal-actions">
        <button class="btn secondary" id="restoreBtn">Restaurar</button>
        <button class="btn primary" id="saveBtn">Guardar</button>
      </div>
      <button class="close" id="closeSettings" aria-label="Cerrar">✕</button>
    </div>
  </div>

  <!-- Scripts (orden importante) -->
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/iu.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
